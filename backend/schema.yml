  /api/detections/:
    get:
      operationId: detections_list
      parameters:
      - in: query
        name: bus
        schema:
          type: string
        description: Filter by bus ID (e.g. BUS-104)
      - in: query
        name: confidence
        schema:
          type: string
        description: Minimum confidence (0.0 to 1.0)
      - in: query
        name: date
        schema:
          type: string
        description: Filter by date YYYY-MM-DD
      - in: query
        name: detection_type
        schema:
          type: string
        description: Filter by detection type (e.g. POTHOLE, WATERLOGGING)
      - in: query
        name: location
        schema:
          type: string
        description: Search by location name
      - in: query
        name: severity
        schema:
          type: string
        description: Filter by severity (LOW, MEDIUM, HIGH, CRITICAL)
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status
