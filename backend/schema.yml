openapi: 3.0.3
info:
  title: Urban Intelligence Platform API
  version: 1.0.0
  description: AI-powered Urban Intelligence Platform turning public transport buses
    into mobile sensing units for Ahmedabad City.
paths:
  /api/alerts/:
    get:
      operationId: alerts_list
      parameters:
      - in: query
        name: is_read
        schema:
          type: string
        description: Filter by read status (true/false)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
        description: Filter by severity (CRITICAL, HIGH, MEDIUM, LOW)
      - in: query
        name: type
        schema:
          type: string
        description: Filter by alert type
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
