components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alert_type:
          type: string
          maxLength: 50
        type:
          type: string
          readOnly: true
        severity:
          $ref: '#/components/schemas/AlertSeverityEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        location:
          type: string
          maxLength: 255
        bus:
          type: integer
          nullable: true
        busId:
          type: string
          readOnly: true
          default: ''
        bus_id:
          type: string
          readOnly: true
          default: ''
        incident:
          type: integer
          nullable: true
        incident_id:
          type: string
          readOnly: true
        confidence:
          type: number
          format: double
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        gps:
          type: string
          readOnly: true
        timestamp:
          type: string
          readOnly: true
        is_read:
          type: boolean
        acknowledged:
          type: boolean
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - alert_type
      - busId
      - bus_id
      - gps
      - id
      - incident_id
      - location
      - message
      - timestamp
      - title
      - type
    AlertSeverityEnum:
      enum:
      - INFO
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `INFO` - Informational
        * `LOW` - Low Priority
        * `MEDIUM` - Medium Priority
        * `HIGH` - High Priority
        * `CRITICAL` - Critical Alert
    Bus:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bus_id:
          type: string
          maxLength: 50
        registration_number:
          type: string
          maxLength: 50
        route:
          type: integer
          nullable: true
        route_name:
          type: string
          readOnly: true
          default: ''
        route_number:
          type: string
          readOnly: true
          default: ''
        status:
          $ref: '#/components/schemas/BusStatusEnum'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        gps:
          type: string
          readOnly: true
        speed:
          type: number
          format: double
        heading:
          type: number
          format: double
        last_seen:
          type: string
          format: date-time
        ai_status:
          type: string
          maxLength: 50
        aiStatus:
          type: string
        current_location_name:
          type: string
          maxLength: 255
        location:
          type: string
        cameras:
          type: string
          readOnly: true
        lastUpdate:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bus_id
      - cameras
      - created_at
      - gps
      - id
      - lastUpdate
      - registration_number
      - route_name
      - route_number
      - updated_at
    BusCamera:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        camera_id:
          type: string
          maxLength: 100
        camera_type:
          $ref: '#/components/schemas/CameraTypeEnum'
        status:
          $ref: '#/components/schemas/BusCameraStatusEnum'
        last_frame:
          type: string
          nullable: true
          maxLength: 500
        resolution:
          type: string
          maxLength: 50
        fps:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        last_seen:
          type: string
          format: date-time
      required:
      - camera_id
      - id
    BusCameraStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - ERROR
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `ERROR` - Error
    BusLocationHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bus:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        gps:
          type: string
          readOnly: true
        speed:
          type: number
          format: double
        heading:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
      required:
      - bus
      - gps
      - id
      - latitude
      - longitude
    BusRequest:
      type: object
      properties:
        bus_id:
          type: string
          minLength: 1
          maxLength: 50
        registration_number:
          type: string
          minLength: 1
          maxLength: 50
        route:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/BusStatusEnum'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        speed:
          type: number
          format: double
        heading:
          type: number
          format: double
        last_seen:
          type: string
          format: date-time
        ai_status:
          type: string
          minLength: 1
          maxLength: 50
        aiStatus:
          type: string
          minLength: 1
        current_location_name:
          type: string
          maxLength: 255
        location:
          type: string
          minLength: 1
      required:
      - bus_id
      - registration_number
    BusRoute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        route_number:
          type: string
          maxLength: 50
        route_name:
          type: string
          maxLength: 255
        start_location:
          type: string
          maxLength: 255
        end_location:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/BusRouteStatusEnum'
        waypoints: {}
        bus_count:
          type: integer
          readOnly: true
      required:
      - bus_count
      - end_location
      - id
      - route_name
      - route_number
      - start_location
    BusRouteRequest:
      type: object
      properties:
        route_number:
          type: string
          minLength: 1
          maxLength: 50
        route_name:
          type: string
          minLength: 1
          maxLength: 255
        start_location:
          type: string
          minLength: 1
          maxLength: 255
        end_location:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/BusRouteStatusEnum'
        waypoints: {}
      required:
      - end_location
      - route_name
      - route_number
      - start_location
    BusRouteStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - DIVERTED
