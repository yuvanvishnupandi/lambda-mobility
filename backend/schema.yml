          minimum: -9223372036854775808
          format: int64
        total_detections:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        road_hazards:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
