        * `VEHICLE` - Vehicle
        * `PEDESTRIAN` - Pedestrian
        * `SCHOOL_CHILD` - School Child Risk
        * `RASH_DRIVING` - Rash Driving
        * `HIT_AND_RUN` - Hit and Run
